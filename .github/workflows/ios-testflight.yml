# Baut die DOM-App als iPhone-App und lädt sie zu TestFlight hoch.
# Läuft auf einem Apple-Rechner von GitHub, ein eigener Mac ist nicht nötig.
# Nötige Geheimnisse (Repository › Settings › Secrets and variables › Actions):
#   APPLE_TEAM_ID      Team-ID aus developer.apple.com › Mitgliedschaft
#   ASC_KEY_ID         Schlüssel-ID des App-Store-Connect-API-Schlüssels
#   ASC_ISSUER_ID      Issuer-ID (steht über der Schlüsselliste)
#   ASC_KEY_P8         Inhalt der .p8-Datei (ganzer Text)
# Fehlen sie, wird der Bau einfach übersprungen.
name: iPhone-App zu TestFlight

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/**'
      - 'docs/**'
      - '.github/workflows/supabase-wach-halten.yml'
  workflow_dispatch:
  # Jeden Monat neu bauen: Eine TestFlight-Version läuft nach 90 Tagen ab. So liegt immer eine frische bereit.
  schedule:
    - cron: '0 4 1 * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      # GitHub schaltet geplante Läufe nach 60 Tagen ohne Änderung am Repository ab.
      # Neu einschalten setzt diese Frist zurück, auch für den Supabase-Wachhalter.
      - name: Geplante Läufe aktiv halten
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for w in ios-testflight.yml supabase-wach-halten.yml; do
            curl -fsS -o /dev/null -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$w/enable" && echo "$w aktiv" || echo "::warning::$w konnte nicht aktiv gehalten werden"
          done

      - name: Geheimnisse da?
        id: pruefen
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "Apple-Schlüssel fehlen noch, Bau übersprungen."
            echo "los=nein" >> "$GITHUB_OUTPUT"
          else
            echo "los=ja" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.pruefen.outputs.los == 'ja'

      - uses: actions/setup-node@v5
        if: steps.pruefen.outputs.los == 'ja'
        with:
          node-version: 22

      - name: Neuestes Xcode wählen
        if: steps.pruefen.outputs.los == 'ja'
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: iPhone-Projekt erzeugen
        if: steps.pruefen.outputs.los == 'ja'
        run: |
          npm install --no-audit --no-fund
          sh ios-resources/www-bauen.sh
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          # Symbol und Startbild
          cp ios-resources/icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          for f in ios/App/App/Assets.xcassets/Splash.imageset/*.png; do cp ios-resources/splash-2732.png "$f"; done
          # Erlaubnisse und Angaben für Apple
          P=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Add :NSCameraUsageDescription string 'DOM braucht die Kamera für Fotos von Räumen, Belegen und Dokumenten.'" $P
          $PB -c "Add :NSMicrophoneUsageDescription string 'DOM braucht das Mikrofon für Sprachaufnahmen und Gespräche vor Ort.'" $P
          $PB -c "Add :NSPhotoLibraryUsageDescription string 'DOM braucht Zugriff auf Fotos, um Bilder zu Projekten hinzuzufügen.'" $P
          $PB -c "Add :NSPhotoLibraryAddUsageDescription string 'DOM speichert Bilder und Unterlagen in deinen Fotos.'" $P
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" $P
          $PB -c "Set :CFBundleDevelopmentRegion de" $P
          $PB -c "Delete :UIRequiredDeviceCapabilities" $P || true
          # Mitteilungen (Push): Berechtigung und Weitergabe des Geräte-Tokens an die App
          cp ios-resources/App.entitlements ios/App/App/App.entitlements
          perl -0pi -e 's/\}\s*\z/\n    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n    }\n\n    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n    }\n}\n/' ios/App/App/AppDelegate.swift
          grep -q capacitorDidRegisterForRemoteNotifications ios/App/App/AppDelegate.swift
          # iPhone-Funktionen (geraet.js): eigenes Plugin, Erlaubnisse, „Öffnen in DOM“ für PDFs und Bilder
          $PB -c "Merge ios-resources/info-zusatz.plist" $P
          # Gesprächsaufnahme läuft im Hintergrund weiter (UIBackgroundModes audio)
          $PB -c "Print :UIBackgroundModes" $P | grep -q audio || $PB -c "Add :UIBackgroundModes: string audio" $P
          $PB -c "Print :UIBackgroundModes" $P | grep -q audio
          cp ios-resources/DomGeraet.swift ios/App/App/DomGeraet.swift
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          ruby ios-resources/projekt-ergaenzen.rb DomGeraet.swift
          # Plugin anmelden: Capacitor lädt alle Klassen aus packageClassList
          node -e 'const f="ios/App/App/capacitor.config.json",c=JSON.parse(require("fs").readFileSync(f));c.packageClassList=[...new Set([...(c.packageClassList||[]),"DomGeraetPlugin"])];require("fs").writeFileSync(f,JSON.stringify(c,null,2))'
          grep -q DomGeraetPlugin ios/App/App/capacitor.config.json
          # Über „Teilen“ geöffnete Dateien merken (SceneDelegate der Capacitor-Vorlage)
          python3 ios-resources/scene-ergaenzen.py ios/App/App/SceneDelegate.swift
          # LiDAR-Raumscan (RoomPlan) braucht iOS 16
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Signatur bei Apple holen
        if: steps.pruefen.outputs.los == 'ja'
        env:
          BUNDLE_ID: de.domprojektmanagement.app
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          # Schlüssel sauber neu aufbauen (verträgt fehlende Kopfzeilen, Windows-Zeilenenden, alles in einer Zeile)
          B64=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$B64" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 ist kein gültiger Schlüssel. Bitte den ganzen Text der Datei AuthKey_....p8 als Secret eintragen."
            exit 1
          fi
          # Verteilungszertifikat und Profil über die Apple-API (kein Mac, kein angemeldetes Gerät nötig)
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          S="$RUNNER_TEMP/sign"
          ASC_KEY_FILE="$KEY" "$RUNNER_TEMP/venv/bin/python" ios-resources/signatur.py "$S"
          # Eigener Schlüsselbund nur für diesen Lauf
          KC="$RUNNER_TEMP/dom.keychain-db"
          PW=$(openssl rand -hex 16)
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          openssl rsa -in "$S/dist.key" -out "$S/dist.rsa.key" -traditional 2>/dev/null || openssl rsa -in "$S/dist.key" -out "$S/dist.rsa.key"
          security import "$S/dist.rsa.key" -k "$KC" -T /usr/bin/codesign -T /usr/bin/security
          security import "$S/dist.cer" -k "$KC" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | sed 's/[0-9A-F]\{40\}/…/'
          rm -f "$S/dist.key" "$S/dist.rsa.key"

      - name: Bauen und signieren
        if: steps.pruefen.outputs.los == 'ja'
        run: |
          VER=$(sed -n "s/.*APP_VERSION *= *'\\([0-9]*\\)'.*/\\1/p" app.js | head -1)
          echo "App-Version $VER, Build ${{ github.run_number }}"
          # Signatur nur am App-Ziel einstellen (nicht an den mitgebauten Paketen)
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $APPLE_TEAM_ID; CODE_SIGN_IDENTITY = \"Apple Distribution\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"$SIGN_PROFILE_NAME\"; CODE_SIGN_ENTITLEMENTS = \"App\/App.entitlements\";/" ios/App/App.xcodeproj/project.pbxproj
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/DOM.xcarchive" archive \
            TARGETED_DEVICE_FAMILY=1 \
            MARKETING_VERSION="$VER.0" CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Zu TestFlight hochladen
        if: steps.pruefen.outputs.los == 'ja'
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>de.domprojektmanagement.app</key><string>$SIGN_PROFILE_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/DOM.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY" ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Aufräumen
        if: always() && steps.pruefen.outputs.los == 'ja'
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_*.p8
          security delete-keychain "$RUNNER_TEMP/dom.keychain-db" 2>/dev/null || true
