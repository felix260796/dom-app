# DOM als Programm für Windows (Electron, Ordner desktop/).
# Bei jedem Merge auf main: bauen und als „Release“ auf GitHub ablegen. Das installierte Programm holt sich
# neue Fassungen von dort selbst (electron-updater) und spielt sie beim nächsten Schließen ein.
# Per „Run workflow“ auf einem Zweig oder bei einem PR, der desktop/ ändert: nur bauen, das Setup liegt dann unten im Lauf unter „Artifacts“ (kein Release).
name: Windows-Programm

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/**'
      - 'ios-resources/**'
  # Testbau, wenn ein PR am Programm selbst etwas ändert (nur bauen, kein Release)
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-programm.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-programm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: App-Dateien übernehmen
        run: node desktop/app-bauen.js

      - name: Programm bauen
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(sed -n "s/.*APP_VERSION *= *'\\([0-9]*\\)'.*/\\1/p" ../app.js | head -1)
          V="$VER.0.${{ github.run_number }}"
          echo "Programm-Fassung $V"
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never -c.extraMetadata.version="$V"
          ls -la dist
          test -f dist/latest.yml
          echo "V=$V" >> "$GITHUB_ENV"

      # Selbst ablegen statt über electron-builder (das lädt parallel hoch und legt das Release dabei doppelt an)
      - name: Als Release ablegen (nur main)
        if: github.ref == 'refs/heads/main'
        working-directory: desktop/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f latest.yml
          gh release create "v$V" "DOM-Setup-$V.exe" "DOM-Setup-$V.exe.blockmap" latest.yml \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "DOM für Windows $V" \
            --notes "Zum Installieren DOM-Setup-$V.exe herunterladen und öffnen. Das installierte Programm aktualisiert sich danach selbst." --latest

      - name: Setup zum Herunterladen ablegen
        uses: actions/upload-artifact@v4
        with:
          name: DOM-Setup
          path: desktop/dist/*.exe
          retention-days: 14
